default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pytest-unit
        name: pytest unit
        entry: uv run --no-sync pytest tests/unit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-ai
        name: pytest Gemini integration
        entry: uv run --no-sync pytest tests/ai -m ai
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
